#version: '3.8'

services:
  trading-system:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # Web UI for rules management
      - "9090:9090"  # Metrics endpoint
    environment:
      - DATABASE_URL=sqlite:/app/data/trading.db
      # Trading Mode Configuration
      - TRADING_MODE=${TRADING_MODE:-PAPER}
      # Paper Trading Configuration
      - PAPER_INITIAL_CASH=${PAPER_INITIAL_CASH:-100000.0}
      - PAPER_COMMISSION_PER_SHARE=${PAPER_COMMISSION_PER_SHARE:-0.005}
      - PAPER_ENABLE_COMMISSION=${PAPER_ENABLE_COMMISSION:-true}
      - PAPER_SESSION_ID=${PAPER_SESSION_ID:-default-session}
      # Rules Engine Configuration
      - RULES_ENGINE_ENABLED=${RULES_ENGINE_ENABLED:-false}
      - RULES_ENGINE_EVALUATION_INTERVAL_MS=${RULES_ENGINE_EVALUATION_INTERVAL_MS}
      - RULES_ENGINE_MAX_DECISION_TIME_MS=${RULES_ENGINE_MAX_DECISION_TIME_MS}
      - RULES_ENGINE_WARNING_THRESHOLD_MS=${RULES_ENGINE_WARNING_THRESHOLD_MS}
      - RULES_TRACK_PERFORMANCE_METRICS=${RULES_TRACK_PERFORMANCE_METRICS:-true}
      - RULES_LOG_ALL_DECISIONS=${RULES_LOG_ALL_DECISIONS:-false}
      - RULES_REQUIRE_USER_CONFIRMATION=${RULES_REQUIRE_USER_CONFIRMATION:-true}
      - RULES_DECISION_HISTORY_DAYS=${RULES_DECISION_HISTORY_DAYS}
      - RULES_FALLBACK_PRICE_SOURCE=${RULES_FALLBACK_PRICE_SOURCE:-REFUSE}
      - RULES_DEFAULT_WATCHLIST_SYMBOLS=${RULES_DEFAULT_WATCHLIST_SYMBOLS}
      - RULES_ALLOW_NEW_POSITIONS=${RULES_ALLOW_NEW_POSITIONS}
      - RULES_MAX_CONCURRENT_RULES=${RULES_MAX_CONCURRENT_RULES}
      # Polygon.io Configuration
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - POLYGON_USE_DELAYED_DATA=${POLYGON_USE_DELAYED_DATA}
      - POLYGON_ENABLE_WEBSOCKET=${POLYGON_ENABLE_WEBSOCKET}
      - POLYGON_WEBSOCKET_RECONNECT_INTERVAL=${POLYGON_WEBSOCKET_RECONNECT_INTERVAL}
      - POLYGON_WEBSOCKET_HEARTBEAT_INTERVAL=${POLYGON_WEBSOCKET_HEARTBEAT_INTERVAL}
      - POLYGON_WEBSOCKET_MAX_SUBSCRIPTIONS=${POLYGON_WEBSOCKET_MAX_SUBSCRIPTIONS}
      - POLYGON_WEBSOCKET_BUFFER_SIZE=${POLYGON_WEBSOCKET_BUFFER_SIZE}
      - POLYGON_DEFAULT_SUBSCRIPTIONS=${POLYGON_DEFAULT_SUBSCRIPTIONS}
      - POLYGON_AUTO_SUBSCRIBE_MOVERS=${POLYGON_AUTO_SUBSCRIBE_MOVERS}
      # LightSpeed Configuration
      - LIGHTSPEED_API_KEY=${LIGHTSPEED_API_KEY}
      - LIGHTSPEED_CONNECTION_URL=${LIGHTSPEED_CONNECTION_URL}
      - LIGHTSPEED_CLIENT_ID=${LIGHTSPEED_CLIENT_ID}
      - LIGHTSPEED_ACCOUNT_ID=${LIGHTSPEED_ACCOUNT_ID}
      - LIGHTSPEED_SANDBOX=${LIGHTSPEED_SANDBOX}
      # Module Control
      - ENABLE_LIGHTSPEED=${ENABLE_LIGHTSPEED:-true}
      - ENABLE_POLYGON=${ENABLE_POLYGON:-true}
      # Application Configuration
      - MAX_MEMORY_MB=${MAX_MEMORY_MB}
      - RUST_LOG=${RUST_LOG}
      - BIND_ADDRESS=${BIND_ADDRESS}
      - METRICS_ADDRESS=${METRICS_ADDRESS}
    volumes:
      - ./data:/app/data              # Persistent database
      - ./logs:/app/logs              # Log files
      - ./config:/app/config          # Configuration files
    restart: unless-stopped
    networks:
      - trading-network

  # Optional: SQLite browser for development debugging
  sqlite-browser:
    image: linuxserver/sqlitebrowser
    container_name: sqlite-browser
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./data:/data
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - trading-network
    profiles:
      - debug

  # Optional: Prometheus for metrics monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    networks:
      - trading-network
    profiles:
      - monitoring

networks:
  trading-network:
    driver: bridge

volumes:
  trading-data:
    driver: local